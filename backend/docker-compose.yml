services:
  backend:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data      # sqlite db lives here, survives rebuilds
    restart: unless-stopped
    expose:
      - "8000"                # not published directly — caddy fronts it

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  caddy_data:
