name: CI

on:
  push:
    branches: [main, Agentbranch]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest==8.3.3
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontendd/package-lock.json
      - run: npm ci
        working-directory: frontendd
      - run: npm run build
        working-directory: frontendd
        env:
          NEXT_PUBLIC_BACKEND_URL: https://agenthub-wine.vercel.app
          AUTH_SECRET: ci-only-placeholder
          GOOGLE_CLIENT_ID: ci-only-placeholder
          GOOGLE_CLIENT_SECRET: ci-only-placeholder
          TWITTER_CLIENT_ID: ci-only-placeholder
          TWITTER_CLIENT_SECRET: ci-only-placeholder