services:
  backend:
    build: .
    env_file: .env
    environment:
      SESSION_REDIS_URL: ${SESSION_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./data:/app/data      # sqlite db lives here, survives rebuilds
    restart: unless-stopped
    expose:
      - "8000"                # not published directly — caddy fronts it
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  caddy_data:
  redis_data:
