services:
  backend:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/agenttrade.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  caddy_data:
